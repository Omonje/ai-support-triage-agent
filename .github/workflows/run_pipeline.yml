name: Run triage pipeline

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort, not exact.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Write cached Gmail OAuth token
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json

      - name: Run the triage pipeline
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID: ${{ secrets.MONDAY_BOARD_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CONFIDENCE_ESCALATION_THRESHOLD: ${{ secrets.CONFIDENCE_ESCALATION_THRESHOLD }}
          GMAIL_LABEL: Triage-Demo
          GMAIL_TOKEN_CACHE_PATH: gmail_token.json
        run: python -m scripts.run_pipeline

      - name: Check for sent drafts and close the loop
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID: ${{ secrets.MONDAY_BOARD_ID }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_LABEL: Triage-Demo
          GMAIL_TOKEN_CACHE_PATH: gmail_token.json
        run: python -m scripts.check_sent_drafts
